[project]
name = "table-to-graph"
version = "0.1.0b1"
description = "Convert PDF tables to typed, queryable graphs for high-accuracy RAG pipelines."
authors = [{ name = "Prajod" }]
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10,<3.14"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "pdfplumber>=0.10.0",
    "networkx>=3.0",
    "pydantic>=2.0",
    "pandas>=2.0",
    "psutil>=5.9",
    "lxml>=5.0",
    "beautifulsoup4>=4.12",
    "tabulate>=0.9.0",
]

[project.optional-dependencies]
vision = [
    "torch>=2.0",
    "torchvision>=0.15",
    "transformers>=4.35",
    "Pillow>=10.0",
    "pypdfium2>=5.13,<6.0",
]

[project.urls]
Repository = "https://github.com/prajod/table_to_graph"
Issues = "https://github.com/prajod/table_to_graph/issues"

[project.scripts]
check_code_quality = "table_to_graph.quality:main"

[tool.poetry]
packages = [{ include = "table_to_graph", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
pytest-cov = ">=5.0"
mypy = ">=1.10"
ruff = ">=0.5"
fpdf2 = ">=2.7"
bandit = "^1.9.4"
langchain-core = "^1.5.6"
llama-index-core = "^0.14.23"

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = "table_to_graph.*"
disallow_untyped_defs = true
disallow_any_generics = true
disallow_untyped_calls = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "numpy.*",
    "pandas.*",
    "networkx.*",
    "psutil.*",
    "pdfplumber.*",
    "bs4.*",
    "lxml.*",
    "torch.*",
    "torchvision.*",
    "transformers.*",
    "pypdfium2.*",
    "PIL.*",
    "tabulate.*",
    "dotenv.*",
    "huggingface_hub.*",
]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.coverage.run]
omit = [
    "src/table_to_graph/quality.py",
    "src/table_to_graph/extractors/tatr_extractor.py",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
