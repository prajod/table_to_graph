name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and build (Ubuntu, Python 3.13)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Poetry
        run: python -m pip install poetry==2.4.1
      - name: Install dependencies
        run: poetry install --with dev --no-interaction
      - name: Run quality, security, and tests
        run: poetry run check_code_quality
      - name: Build wheel and source distribution
        run: poetry build
      - name: Smoke-test the built wheel
        run: |
          poetry run python -m pip install --force-reinstall --no-deps dist/*.whl
          poetry run python -c "import table_to_graph; print(table_to_graph.__version__)"

  python-compatibility:
    name: Python ${{ matrix.python-version }} (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Poetry
        run: python -m pip install poetry==2.4.1
      - name: Install dependencies
        run: poetry install --with dev --no-interaction
      - name: Run tests
        run: poetry run pytest -q tests

  windows:
    name: Windows CMD (Python 3.13)
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Poetry
        run: python -m pip install poetry==2.4.1
      - name: Install dependencies
        run: poetry install --with dev --no-interaction
      - name: Run tests with an ASCII Windows console
        run: set PYTHONUTF8=0&& poetry run pytest -q tests
